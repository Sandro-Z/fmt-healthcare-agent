[project]
name = "wgs-fmt-platform"
version = "0.5.0"
description = "WGS-FMT analysis agent with a Next.js workspace and FastAPI service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "jinja2>=3.1",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "python-multipart>=0.0.9",
  "typer>=0.12",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.6"]
infra = [
  "boto3>=1.34",
  "psycopg[binary]>=3.2",
  "sqlalchemy>=2.0",
  "pymysql>=1.1",
  "redis>=5.0",
  "elasticsearch>=8.15,<9",
  "email-validator>=2.2",
]
legacy = [
  "anthropic>=0.109.0",
  "openai>=2.0.0",
  "rich>=13.0",
  "textual>=0.50",
  "pandas>=2.0",
  "numpy>=1.24",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "openpyxl>=3.1",
  "requests>=2.31",
  "fpdf2[web]>=2.8.7",
  "plotly>=6.0",
]
fmt = ["torch>=2.2"]

[project.scripts]
wgs-fmt = "wgs_fmt_platform.cli:app"
wgs-daemon = "wgs_agent.core.app:run"
wgs-agent = "wgs_agent.cli.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wgs_fmt_platform", "src/wgs_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "apps/workspace-api"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
