    { name = "elasticsearch" },
    { name = "email-validator" },
    { name = "psycopg", extra = ["binary"] },
    { name = "pymysql" },
    { name = "redis" },
    { name = "sqlalchemy" },
]
legacy = [
    { name = "anthropic" },
    { name = "fpdf2" },
    { name = "matplotlib" },
    { name = "numpy" },
    { name = "openai" },
    { name = "openpyxl" },
    { name = "pandas" },
    { name = "plotly" },
    { name = "requests" },
    { name = "rich" },
    { name = "scikit-learn" },
    { name = "scipy" },
    { name = "seaborn" },
    { name = "textual" },
]

[package.metadata]
requires-dist = [
    { name = "anthropic", marker = "extra == 'legacy'", specifier = ">=0.109.0" },
    { name = "boto3", marker = "extra == 'infra'", specifier = ">=1.34" },
    { name = "elasticsearch", marker = "extra == 'infra'", specifier = ">=8.15,<9" },
    { name = "email-validator", marker = "extra == 'infra'", specifier = ">=2.2" },
    { name = "fastapi", specifier = ">=0.115" },
    { name = "fpdf2", marker = "extra == 'legacy'", specifier = ">=2.8.7" },
    { name = "httpx", specifier = ">=0.27" },
    { name = "jinja2", specifier = ">=3.1" },
    { name = "matplotlib", marker = "extra == 'legacy'", specifier = ">=3.8" },
    { name = "numpy", marker = "extra == 'legacy'", specifier = ">=1.24" },
    { name = "openai", marker = "extra == 'legacy'", specifier = ">=2.0.0" },
    { name = "openpyxl", marker = "extra == 'legacy'", specifier = ">=3.1" },
    { name = "pandas", marker = "extra == 'legacy'", specifier = ">=2.0" },
    { name = "plotly", marker = "extra == 'legacy'", specifier = ">=6.0" },
    { name = "psycopg", extras = ["binary"], marker = "extra == 'infra'", specifier = ">=3.2" },
    { name = "pydantic", specifier = ">=2.8" },
    { name = "pydantic-settings", specifier = ">=2.4" },
    { name = "pymysql", marker = "extra == 'infra'", specifier = ">=1.1" },
    { name = "pytest", marker = "extra == 'dev'", specifier = ">=8.2" },
    { name = "pytest-asyncio", marker = "extra == 'dev'", specifier = ">=0.23" },
    { name = "python-dotenv", specifier = ">=1.0" },
    { name = "python-multipart", specifier = ">=0.0.9" },
    { name = "redis", marker = "extra == 'infra'", specifier = ">=5.0" },
    { name = "requests", marker = "extra == 'legacy'", specifier = ">=2.31" },
    { name = "rich", marker = "extra == 'legacy'", specifier = ">=13.0" },
    { name = "ruff", marker = "extra == 'dev'", specifier = ">=0.6" },
    { name = "scikit-learn", marker = "extra == 'legacy'", specifier = ">=1.4" },
    { name = "scipy", marker = "extra == 'legacy'", specifier = ">=1.11" },
    { name = "seaborn", marker = "extra == 'legacy'", specifier = ">=0.13" },
    { name = "sqlalchemy", marker = "extra == 'infra'", specifier = ">=2.0" },
    { name = "textual", marker = "extra == 'legacy'", specifier = ">=0.50" },
    { name = "torch", marker = "extra == 'fmt'", specifier = ">=2.2" },
    { name = "typer", specifier = ">=0.12" },
    { name = "uvicorn", specifier = ">=0.30" },
]
provides-extras = ["dev", "infra", "legacy", "fmt"]
